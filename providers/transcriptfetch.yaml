provider: transcriptfetch
docs_url: https://transcriptfetch.com/docs
status: draft

auth:
  location: header
  format: "Authorization: Bearer {key}"
  bad_key_behavior: >-
    A bad or missing key returns a real HTTP 401 with a JSON error envelope:
    {"ok": false, "request_id": "req_...", "error": {"code": "unauthorized",
    "number": 1101, "message": "Missing or invalid API key.", "docs":
    "https://transcriptfetch.com/docs/errors/unauthorized"}}. Every error
    (auth, no-captions, quota, bad URL) uses the same envelope with ok=false,
    so checking `ok` in the body is equivalent to checking the status code.

pricing:
  model: credits
  amount: 5.0
  currency: USD
  free_tier: "100 credits per month, no card required. 1 credit = 1 successful transcript or listing page; failed requests are not charged. Audio transcription (videos with no captions) costs 2 credits per minute of audio."
  source_url: https://transcriptfetch.com/pricing
  checked: 2026-09-09
  note: "Monthly plans: Basic $5 / 1,000 credits, Pro $15 / 10,000, Mega $45 / 50,000, Scale $229 / 300,000. Credits can also be topped up per plan."

endpoints:
  - id: transcriptfetch.get-transcript
    method: POST
    path: /api/v2/transcripts/video
    summary: "Full transcript text (plus timestamped segments by default) for one YouTube, TikTok, Instagram, Spotify, Apple Podcasts, RSS or direct media URL."
    params:
      - name: video
        in: body
        type: string
        required: true
        example: "https://www.youtube.com/watch?v=jNQXAC9IVRw"
      - name: mode
        in: body
        type: string
        required: false
        example: "auto"
      - name: timestamps
        in: body
        type: boolean
        required: false
        example: false
      - name: callback_url
        in: body
        type: string
        required: false
        example: "https://example.com/hooks/transcript"
    note: >-
      `mode` is "auto" (captions when present, otherwise transcribe the audio),
      "captions" (fail with no_captions instead of transcribing) or "audio"
      (always transcribe). When a request escalates to audio transcription the
      call returns 202 with a job id to poll at /api/v2/transcripts/jobs/{jobId},
      or POSTs the finished transcript to `callback_url` if given. A bare
      11-character YouTube ID is accepted in place of a URL.

  - id: transcriptfetch.search
    method: POST
    path: /api/v2/transcripts/search
    summary: "Keyword search for videos or episodes; each result's URL can be passed straight to get-transcript."
    params:
      - name: query
        in: body
        type: string
        required: true
        example: "python tutorial"
      - name: platform
        in: body
        type: string
        required: false
        example: "youtube"
      - name: limit
        in: body
        type: integer
        required: false
        example: 5
      - name: cursor
        in: body
        type: string
        required: false
        example: "eyJvIjoyfQ"
    note: "`platform` is youtube (default), tiktok, instagram, spotify, apple or rss. Paginate with the opaque `next_cursor` from the previous response."

  - id: transcriptfetch.list-channel
    method: POST
    path: /api/v2/transcripts/channel
    summary: "List a YouTube channel's, TikTok or Instagram profile's, podcast show's or RSS feed's items, newest first."
    params:
      - name: channel
        in: body
        type: string
        required: true
        example: "@mkbhd"
      - name: limit
        in: body
        type: integer
        required: false
        example: 5
      - name: cursor
        in: body
        type: string
        required: false
        example: ""
      - name: since_video_id
        in: body
        type: string
        required: false
        example: ""
    note: "`since_video_id` trims the page to items newer than one you already have, which makes polling for new uploads a single call."

  - id: transcriptfetch.list-playlist
    method: POST
    path: /api/v2/transcripts/playlist
    summary: "List the videos or episodes in a YouTube, TikTok or Spotify playlist."
    params:
      - name: playlist
        in: body
        type: string
        required: true
        example: "https://www.youtube.com/playlist?list=PL590L5WQmH8dpP0RyH5pCfIWVL7cgoR_r"
      - name: limit
        in: body
        type: integer
        required: false
        example: 5
      - name: cursor
        in: body
        type: string
        required: false
        example: ""
    note: ""

  - id: transcriptfetch.batch
    method: POST
    path: /api/v2/transcripts/batch
    summary: "Fetch up to 500 transcripts in one call (50 on the free tier); per-item results, only successes are charged."
    params:
      - name: video_ids
        in: body
        type: array
        required: true
        example: ["jNQXAC9IVRw", "https://www.tiktok.com/@scout2015/video/6718335390845095173"]
      - name: mode
        in: body
        type: string
        required: false
        example: "auto"
    note: "`mode` defaults to auto; pass \"captions\" to avoid audio-transcription charges on uncaptioned items."

  - id: transcriptfetch.get-job
    method: GET
    path: /api/v2/transcripts/jobs/{jobId}
    summary: "Poll an audio-transcription job started by get-transcript or batch until it returns the transcript."
    params:
      - name: jobId
        in: path
        type: string
        required: true
        example: "job_abc123"
    note: ""

  - id: transcriptfetch.me
    method: GET
    path: /api/v2/me
    summary: "Validate the key and read the remaining credit balance; free to call."
    params: []
    note: ""

base_url: https://transcriptfetch.com
